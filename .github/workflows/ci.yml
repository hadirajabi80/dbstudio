name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # No Docker on the runners: SQL Server/Oracle integration tests skip themselves.
  DBSTUDIO_IT: "0"
  # Windows: unsigned build (PLAN R10). macOS: scripts/build.sh decides (ad-hoc unless signing secrets are set).
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  # Windows: tests + NSIS installer (unchanged).
  build:
    name: Windows (tests + installer)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            desktop/package-lock.json

      - name: Version
        id: version
        run: |
          $v = (Get-Content -Raw version.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "DbStudio $v"

      # ---- engine -----------------------------------------------------------------------------
      - name: Engine tests
        run: dotnet test engine/DbStudio.slnx -c Release --logger "trx;LogFilePrefix=engine" --results-directory TestResults

      # NU1902/NU1903 already fail the restore (engine/Directory.Build.props); this also lists low-severity and
      # transitive advisories and fails on any of them.
      - name: Engine vulnerable packages
        run: |
          $out = dotnet list engine/DbStudio.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "dotnet list package failed ($LASTEXITCODE)" }
          if ($out -match 'has the following vulnerable packages') { throw 'Vulnerable NuGet packages found (see above). Pin a patched version.' }

      # ---- ui ---------------------------------------------------------------------------------
      - name: UI install
        working-directory: ui
        run: npm ci
      - name: UI lint
        working-directory: ui
        run: npm run lint
      - name: UI type-check
        working-directory: ui
        run: npm run typecheck
      - name: UI tests
        working-directory: ui
        run: npm test
      # vitest.config.ts leaves src/editor and src/intel out (they run in a node environment with their own config,
      # vitest.intel.config.ts): the IntelliSense and editor tests only run in this step.
      - name: UI editor/IntelliSense tests
        working-directory: ui
        run: npm run test:intel
      # (the UI production build runs inside scripts/build.ps1 below; its size is checked after it)

      # ---- desktop ----------------------------------------------------------------------------
      - name: Desktop install
        working-directory: desktop
        run: npm ci
      - name: Desktop tests (type-check, lifecycle with fake engine, Electron smoke)
        working-directory: desktop
        run: npm test

      # ---- package ----------------------------------------------------------------------------
      - name: Build installer (engine publish + UI build + electron-builder)
        run: ./scripts/build.ps1

      # PLAN-M1.5 5.5: the gzipped ui/dist may grow at most 600 KB over M1. The baseline in
      # .github/bundle-size-baseline.json is the M1 build (commit bfaac37); never re-baseline it on the
      # current tree to get past this step (see the header of .github/scripts/bundle-size.mjs).
      - name: UI bundle size
        run: node .github/scripts/bundle-size.mjs --dist ui/dist --budget-kb 600

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DbStudio-Setup-${{ steps.version.outputs.version }}
          path: desktop/dist/DbStudio-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

  # macOS: engine + desktop tests on a Mac (Keychain store, process-group kill, Electron smoke), then a DMG and ZIP
  # per architecture. macos-latest is Apple Silicon; the x64 engine and app are cross-built and packaged there.
  macos:
    name: macOS (tests + DMG)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            desktop/package-lock.json

      - name: Version
        id: version
        run: |
          v=$(node -p "require('./version.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "DbStudio $v"

      # ---- tests ------------------------------------------------------------------------------
      - name: Engine tests (includes the real Keychain round trip)
        run: dotnet test engine/DbStudio.slnx -c Release --logger "trx;LogFilePrefix=engine-macos" --results-directory TestResults

      - name: UI install
        working-directory: ui
        run: npm ci
      # (UI tests, including `npm run test:intel`, are platform independent and run in the Windows job; the production
      # build runs in build.sh.)

      - name: Desktop install
        working-directory: desktop
        run: npm ci
      - name: Desktop tests (type-check, lifecycle, platform, Electron smoke)
        working-directory: desktop
        run: npm test

      # ---- package ----------------------------------------------------------------------------
      # Ad-hoc signed unless the repository defines these secrets (Developer ID .p12 as base64, plus notarization).
      - name: Build DMG + ZIP (engine publish osx-arm64/osx-x64 + UI build + electron-builder)
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/build.sh

      - name: Upload DMG and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DbStudio-${{ steps.version.outputs.version }}-mac
          path: |
            desktop/dist/DbStudio-*-mac-*.dmg
            desktop/dist/DbStudio-*-mac-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: TestResults/
          if-no-files-found: ignore
