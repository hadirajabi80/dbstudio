name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: 'Also run the Docker integration suites (PostgreSQL, Redis, MongoDB, Kafka) on ubuntu-latest'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # No Docker on the runners: SQL Server/Oracle integration tests skip themselves.
  DBSTUDIO_IT: "0"
  # Windows: unsigned build (PLAN R10). macOS: scripts/build.sh decides (ad-hoc unless signing secrets are set).
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  # Windows: tests + NSIS installer (unchanged).
  build:
    name: Windows (tests + installer)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            desktop/package-lock.json

      - name: Version
        id: version
        run: |
          $v = (Get-Content -Raw version.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "DbStudio $v"

      # ---- engine -----------------------------------------------------------------------------
      - name: Engine tests
        run: dotnet test engine/DbStudio.slnx -c Release --logger "trx;LogFilePrefix=engine" --results-directory TestResults
      # Failed tests as annotations (name, message, top of the stack), readable without downloading the artifact.
      - name: Annotate failed engine tests
        if: failure()
        run: node .github/scripts/trx-annotate.mjs TestResults

      # NU1902/NU1903 already fail the restore (engine/Directory.Build.props); this also lists low-severity and
      # transitive advisories and fails on any of them.
      - name: Engine vulnerable packages
        run: |
          $out = dotnet list engine/DbStudio.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "dotnet list package failed ($LASTEXITCODE)" }
          if ($out -match 'has the following vulnerable packages') { throw 'Vulnerable NuGet packages found (see above). Pin a patched version.' }

      # ---- ui ---------------------------------------------------------------------------------
      - name: UI install
        working-directory: ui
        run: npm ci
      - name: UI lint
        working-directory: ui
        run: npm run lint
      - name: UI type-check
        working-directory: ui
        run: npm run typecheck
      - name: UI tests
        working-directory: ui
        run: npm test
      # vitest.config.ts leaves src/editor and src/intel out (they run in a node environment with their own config,
      # vitest.intel.config.ts): the IntelliSense and editor tests only run in this step.
      - name: UI editor/IntelliSense tests
        working-directory: ui
        run: npm run test:intel
      # (the UI production build runs inside scripts/build.ps1 below; its size is checked after it)

      # ---- desktop ----------------------------------------------------------------------------
      - name: Desktop install
        working-directory: desktop
        run: npm ci
      - name: Desktop tests (type-check, lifecycle with fake engine, Electron smoke)
        working-directory: desktop
        run: npm test

      # ---- package ----------------------------------------------------------------------------
      - name: Build installer (engine publish + UI build + electron-builder)
        run: ./scripts/build.ps1

      # PLAN-M2 D10: the gzipped ui/dist may grow at most 1,400 KB over M1 (baseline: the M1 build, commit bfaac37),
      # and the initial load (entry chunk + static imports) at most 120 KB over the M2-0 tree ("initial" in
      # .github/bundle-size-baseline.json). Never re-baseline either on the current tree to get past this step
      # (see the header of .github/scripts/bundle-size.mjs).
      - name: UI bundle size
        run: node .github/scripts/bundle-size.mjs --dist ui/dist --budget-kb 1400 --initial-kb 120

      # PLAN-M2 D8: the published engine starts and answers GET /providers (M2-K adds the librdkafka load check).
      - name: Engine native smoke
        run: node scripts/ci/kafka-native-smoke.mjs engine/publish/DbStudio.Engine.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DbStudio-Setup-${{ steps.version.outputs.version }}
          path: desktop/dist/DbStudio-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

  # macOS: engine + desktop tests on a Mac (Keychain store, process-group kill, Electron smoke), then a DMG and ZIP
  # per architecture. macos-latest is Apple Silicon; the x64 engine and app are cross-built and packaged there.
  macos:
    name: macOS (tests + DMG)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            desktop/package-lock.json

      - name: Version
        id: version
        run: |
          v=$(node -p "require('./version.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "DbStudio $v"

      # ---- tests ------------------------------------------------------------------------------
      - name: Engine tests (includes the real Keychain round trip)
        run: dotnet test engine/DbStudio.slnx -c Release --logger "trx;LogFilePrefix=engine-macos" --results-directory TestResults
      - name: Annotate failed engine tests
        if: failure()
        run: node .github/scripts/trx-annotate.mjs TestResults

      - name: UI install
        working-directory: ui
        run: npm ci
      # (UI tests, including `npm run test:intel`, are platform independent and run in the Windows job; the production
      # build runs in build.sh.)

      - name: Desktop install
        working-directory: desktop
        run: npm ci
      # On failure, the last lines of the output also become annotations (readable without downloading logs).
      - name: Desktop tests (type-check, lifecycle, platform, Electron smoke)
        working-directory: desktop
        run: |
          set +e
          npm test 2>&1 | tee desktop-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "not ok|Error|error|failed|✖|expected|actual" desktop-test.log | tail -n 10 | while IFS= read -r line; do echo "::error title=desktop test::$line"; done
          fi
          exit "$status"

      # ---- package ----------------------------------------------------------------------------
      # Ad-hoc signed unless the repository defines these secrets (Developer ID .p12 as base64, plus notarization).
      - name: Build DMG + ZIP (engine publish osx-arm64/osx-x64 + UI build + electron-builder)
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/build.sh

      # PLAN-M2 D8: the published osx-arm64 engine starts and answers GET /providers (M2-K adds the librdkafka load
      # check and the osx-x64 file/otool/codesign checks).
      - name: Engine native smoke
        run: node scripts/ci/kafka-native-smoke.mjs engine/publish/osx-arm64/DbStudio.Engine

      - name: Upload DMG and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DbStudio-${{ steps.version.outputs.version }}-mac
          path: |
            desktop/dist/DbStudio-*-mac-*.dmg
            desktop/dist/DbStudio-*-mac-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: TestResults/
          if-no-files-found: ignore

  # PLAN-M2 10: optional, non-blocking Docker integration run (manual workflow_dispatch with integration=true).
  integration:
    name: Integration (Docker, optional)
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      DBSTUDIO_IT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Start services
        run: docker compose -f engine/tests/docker/compose.yml --profile kafka up -d postgres redis mongo kafka schema-registry
      - name: Engine tests (with Docker services)
        run: dotnet test engine/DbStudio.slnx -c Release --logger "trx;LogFilePrefix=engine-it" --results-directory TestResults
      - name: Stop services
        if: always()
        run: docker compose -f engine/tests/docker/compose.yml --profile kafka down -v
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: TestResults/
          if-no-files-found: ignore
